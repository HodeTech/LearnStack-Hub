# LearnStack Hub — end-to-end test compose overlay.
#
# Layered on top of `dev.yml`:
#     docker compose -f infra/compose/dev.yml -f infra/compose/e2e.yml up
# (the canonical `make` target is `make e2e-up`.)
#
# Hub's e2e overlay is minimal because Hub doesn't run its own data services
# in dev (Postgres / Valkey / Kafka live in LearnStack core's compose).
# Hub-side ephemerality must therefore come from LearnStack core's e2e
# overlay (which `tmpfs`-mounts Postgres' data directory) — when LearnStack
# core's compose is started with its `e2e.yml` overlay, the shared Postgres
# loses the `learnstack_hub` database on every restart, and Hub's
# `postgres-hub-init` recreates it on the next boot via the idempotent
# `IF NOT EXISTS`-guarded SQL at `infra/postgres/init/01-create-hub-database.sql`.
#
# What this file does NOT do today:
#   - It does NOT drop or recreate the `learnstack_hub` database on its own —
#     the init script is one-shot + idempotent and never drops.
#   - It does NOT clear Hub Dapr sidecar state — Dapr has no persistent state
#     for the pub/sub building block (consumer offsets live in Kafka).
#
# P02c-7 may add a drop-and-recreate variant of the init script via this
# overlay if the SaaS e2e rehearsal needs strict per-run isolation.
#
# P02c-7 will extend this overlay with Hub-specific test fixtures (seeded
# operator account, demo plans, demo tenant for the SaaS rehearsal scenario).

name: learnstack-hub-e2e

# P02c-7 adds e2e-only overrides under `services:` below. Until then the
# overlay must declare `services` as an EMPTY MAPPING (`{}`) — not a null
# block. Compose v2 rejects a `services:` key with only comment children
# (parses as null) with `services must be a mapping`, which would break
# `make e2e-up` in main. Confirmed by:
#     docker compose -f infra/compose/dev.yml -f infra/compose/e2e.yml config
# An empty mapping is a valid no-op overlay; the dev stack passes through
# unchanged.
services: {}
