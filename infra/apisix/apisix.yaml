# Hub APISIX route table — hot-reloaded on file change.
#
# Hub gateway fronts:
#   - `/healthz` (priority 1, public, GET only) — proxies to the Hub API
#   - `/api/v1/internal/license/verify` (P02c-2) — LearnStack → Hub
#   - `/api/v1/usage/report` (P02c-2) — LearnStack → Hub
#   - `/api/v1/operator/**` (P02c-4) — operator portal BFF calls (Keycloak
#     learnstack-hub realm JWT)
#
# This route table is INTENTIONALLY MINIMAL in P02c-0 — only the healthz
# route is wired. The internal license-verify + usage-report routes land in
# P02c-2 with the actual handlers; the operator routes land in P02c-4.
#
# IMPORTANT: Hub APISIX is a SEPARATE INSTANCE from LearnStack core's
# APISIX. LearnStack core's APISIX (port 9080) fronts `/api/internal/*`
# from Hub → LearnStack. Hub APISIX (port 9180) fronts the LearnStack →
# Hub direction. The two flows never share a gateway.

routes:
  - id: 1
    uri: /healthz
    methods: [GET]
    priority: 1
    plugins:
      cors: {}
      limit-req:
        rate: 10
        burst: 5
        key: remote_addr
        rejected_code: 429
      prometheus: {}
    upstream:
      type: roundrobin
      nodes:
        # The Hub .NET API runs OUTSIDE compose during active dev
        # (`dotnet run` on the workstation, port 5181).
        "host.docker.internal:5181": 1

  # ---- P02c-2 placeholders --------------------------------------------------
