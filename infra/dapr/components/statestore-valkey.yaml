# Hub Dapr state store — RESP-protocol backend (Valkey).
# Backs Hub's `ICacheService` (L2 cache). Hub uses `hub:*` key prefix to
# avoid namespace collision with LearnStack core's cache keys in the shared
# Valkey instance.
#
# `spec.type: state.redis` is the Dapr provider-type identifier — RESP-
# protocol adapter, NOT the Redis Inc. brand. Per ADR-0030 the backend is
# Valkey 8.x; Dapr's `state.redis` adapter consumes it without change.
# (Filename uses `-valkey` here because Hub naming is fresh; LearnStack core
# keeps `-redis` for the Dapr provider-type-suffix convention. The wire
# protocol is identical.)
#
# `actorStateStore: "false"` — same as LearnStack core; per ADR-0014 actors
# are out of scope. Flipping to "true" requires a new ADR.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: host.docker.internal:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "false"
    - name: keyPrefix
      value: hub
