# Hub Dapr secret store — HashiCorp Vault backend.
# Backs Hub's `ISecretProvider`. Hub uses `learnstack-hub/*` path prefix
# (vs LearnStack core's `learnstack/*`) so secret namespaces stay distinct
# in the shared Vault instance.
#
# Single source of truth: `VAULT_ROOT_TOKEN` from the repo-root `.env.example`.
# Indirection chain (mirrors LearnStack core):
#   1. `.env` carries the token (gitignored).
#   2. `infra/compose/dev.yml` passes it into `dapr-sidecar-hub` as
#      `VAULT_ROOT_TOKEN`.
#   3. `secretstore-envvar.yaml` registers `envvar-secrets`.
#   4. THIS component's `auth.secretStore: envvar-secrets` makes Dapr resolve
#      `vaultToken` via `secretKeyRef` from process env at load time.
#
# Vault address points at `host.docker.internal:8200` because Vault runs in
# LearnStack core's compose stack — Hub does not run its own Vault.
#
# PRODUCTION NOTE: Never deploy a config carrying `vaultToken` literally in
# production — wire AppRole / Kubernetes auth per Dapr's documented patterns.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - name: vaultAddr
      value: http://host.docker.internal:8200
    - name: vaultToken
      secretKeyRef:
        name: VAULT_ROOT_TOKEN
        key: VAULT_ROOT_TOKEN
    - name: vaultKVPrefix
      value: secret
auth:
  secretStore: envvar-secrets
