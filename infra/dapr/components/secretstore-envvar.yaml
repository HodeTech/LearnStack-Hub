# Hub Dapr local environment-variable secret store.
# Same indirection pattern as LearnStack core — other components reference
# process env vars via `secretKeyRef` instead of carrying literal values.
#
# Dev-only. Production swaps `secretstores.hashicorp.vault` (with AppRole)
# in front of every component, so this env-secret-store does not ship outside
# `DeploymentMode == Development`.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: envvar-secrets
spec:
  type: secretstores.local.env
  version: v1
