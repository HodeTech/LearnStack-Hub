# LearnStack Hub — Leakwatch configuration.
#
# Active hygiene: every commit triggers a single repo-root scan
# (`leakwatch scan fs .`) from the pre-commit hook when the binary is on
# PATH, plus the same `leakwatch scan fs .` invocation in CI. (The current
# Leakwatch CLI takes a directory target, not per-file; LearnStack core's
# hook attempts per-file invocation and fails — Hub uses repo-root scan.)
# Per LearnStack Standards 12 § Secrets Management (which Hub inherits by
# reference).
#
# The intentional dev credentials in this repo (Vault root token in .env.example,
# HMAC dev shared secret) are filtered out by:
#   1. `detection.entropy.threshold: 4.2` — short low-entropy literals fall
#      below the threshold.
#   2. `.leakwatchignore` — env templates excluded by path.
#   3. Inline `# leakwatch:ignore` for single high-entropy literals.

# ── Scan Engine ─────────────────────────────────────────────────────────
scan:
  concurrency: 4
  max-file-size: 10485760 # 10 MB

# ── Detection ───────────────────────────────────────────────────────────
detection:
  entropy:
    enabled: true
    threshold: 4.2

# ── Verification ────────────────────────────────────────────────────────
# CI must stay hermetic (no outbound API calls to vendor verifier endpoints
# for dev tokens). Local developers can override with `--verify`.
verification:
  enabled: false

# ── Filter ──────────────────────────────────────────────────────────────
filter:
  exclude-paths:
    # Build / generated artifacts. Use `**/path/**` so the glob matches nested
    # paths like `frontend/node_modules/...`. `node_modules/**` alone matches
    # only top-level `node_modules/`.
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.next/**"
    - "**/bin/**"
    - "**/obj/**"
    - "**/coverage/**"
    # Lock files
    - "**/*.lock"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/go.sum"
    # Minified assets
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/*.map"
    # Binary assets
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.gif"
    - "**/*.ico"
    - "**/*.woff"
    - "**/*.woff2"
    - "**/*.ttf"
    # NOTE: `**/*.lic` / `**/*.pem` / `**/*.key` / `**/*.crt` are deliberately
    # NOT excluded here. Excluding them globally would hide exactly the
    # license + cert material P02c-5 / P02c-6 will introduce — including any
    # accidental production secret in those file extensions. Per Standards 20
    # § Secrets Management production secrets must never reach the repo;
    # Leakwatch is the safety net that catches violations. When P02c-5 / P02c-6
    # land specific dev fixture files, add a narrow path-level allowlist
    # (e.g. `tests/fixtures/dev-cert.pem`) instead of broadening this glob.
    # Local-only research (gitignored anyway)
    - "docs/analysis/**"
  exclude-detectors: []

# ── Output ──────────────────────────────────────────────────────────────
output:
  format: table
  file: ""
  show-raw: false
  severity-threshold: medium
